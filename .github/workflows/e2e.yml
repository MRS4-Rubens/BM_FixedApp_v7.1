name: E2E (Staging Preview)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Vercel Preview URL to test (leave blank to auto-detect)'
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == github.event.pull_request.head.repo.full_name || github.event_name == 'workflow_dispatch'
    env:
      CI: 'true'
      E2E_TARGET: staging
      E2E_CONFIRM_STAGING: ${{ secrets.E2E_CONFIRM_STAGING }}
      E2E_STAGING_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL_UNPOOLED: ${{ secrets.E2E_STAGING_DATABASE_URL_UNPOOLED }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_EXPECT_VERIFICATION_REQUIRED: ${{ vars.E2E_EXPECT_VERIFICATION_REQUIRED || 'true' }}
      E2E_VERIFY_MODE: ${{ vars.E2E_VERIFY_MODE || 'direct_db' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify Staging Secrets
        run: |
          MISSING=0
          if [ -z "${E2E_CONFIRM_STAGING:-}" ]; then
            echo "::error::Missing secret: E2E_CONFIRM_STAGING (must be 'yes-this-is-not-production')"
            MISSING=1
          fi
          if [ -z "${E2E_STAGING_DATABASE_URL:-}" ]; then
            echo "::error::Missing secret: E2E_STAGING_DATABASE_URL (isolated staging branch)"
            MISSING=1
          fi
          if [ -z "${E2E_STAGING_DATABASE_URL_UNPOOLED:-}" ]; then
            echo "::error::Missing secret: E2E_STAGING_DATABASE_URL_UNPOOLED"
            MISSING=1
          fi
          if [ -z "${E2E_ADMIN_EMAIL:-}" ]; then
            echo "::error::Missing secret: E2E_ADMIN_EMAIL"
            MISSING=1
          fi
          if [ -z "${E2E_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Missing secret: E2E_ADMIN_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Please configure repository secrets according to docs/e2e-staging-setup.md"
            exit 1
          fi

      - name: Resolve Target Preview URL
        id: resolve-url
        run: |
          if [ -n "${{ github.event.inputs.preview_url }}" ]; then
            echo "preview_url=${{ github.event.inputs.preview_url }}" >> "$GITHUB_OUTPUT"
            echo "Using manual input preview URL: ${{ github.event.inputs.preview_url }}"
          else
            chmod +x ./scripts/ci/wait-for-preview.sh
            ./scripts/ci/wait-for-preview.sh
          fi

      - name: Run Staging Migrations
        run: pnpm e2e:migrate-staging

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        env:
          E2E_BASE_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: pnpm e2e

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write Job Summary
        if: always()
        run: |
          echo "## Playwright E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: \`${{ steps.resolve-url.outputs.preview_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Verification Mode**: \`${{ env.E2E_VERIFY_MODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Report**: Download the \`playwright-report\` artifact for full trace viewer and video evidence." >> $GITHUB_STEP_SUMMARY

