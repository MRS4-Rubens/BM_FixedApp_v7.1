name: E2E (runner app)

# LAUNCH-L5 (docs/LAUNCH_CHECKLIST.md 2.8): builds the pull request and runs it with `next start` ON THE RUNNER
# (http://localhost:3000), then runs the Playwright suite against it. No Vercel preview, no bypass secret, no
# Mailosaur: e-mail confirmation uses E2E_VERIFY_MODE=db (the test database is marked verified directly).
#
# The app and the tests use ONLY test services: the test Neon database + its Neon Auth, plus a local Redis look-alike
# (rate limits). CustomJS and Brevo get obviously fake keys, so no real PDF or e-mail is ever sent.
# Neon Auth allows localhost by default ("Allow Localhost"), so no trusted-domain step is needed on the test
# project. (Production must have Allow Localhost OFF: checklist section 3.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time: all runs share the single test database.
  group: e2e-staging
  cancel-in-progress: false

jobs:
  config:
    name: E2E staging configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs never receive secrets, so never run there.
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.pull_request.head.repo.full_name
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      E2E_CONFIRM_STAGING: ${{ secrets.E2E_CONFIRM_STAGING }}
      E2E_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL_UNPOOLED: ${{ secrets.E2E_STAGING_DATABASE_URL_UNPOOLED }}
      E2E_NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      E2E_DB_HOST_ALLOWLIST: ${{ vars.E2E_DB_HOST_ALLOWLIST }}
      E2E_FORBIDDEN_DB_HOSTS: ${{ vars.E2E_FORBIDDEN_DB_HOSTS }}
      E2E_FORBIDDEN_HOSTS: ${{ vars.E2E_FORBIDDEN_HOSTS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Check staging configuration
        id: check
        run: |
          MISSING=""
          for NAME in E2E_CONFIRM_STAGING E2E_DATABASE_URL E2E_STAGING_DATABASE_URL_UNPOOLED E2E_NEON_AUTH_BASE_URL \
                      E2E_DB_HOST_ALLOWLIST E2E_FORBIDDEN_DB_HOSTS E2E_FORBIDDEN_HOSTS E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::notice::E2E is not configured (missing:$MISSING). Skipping. See docs/LAUNCH_CHECKLIST.md section 4.2."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright E2E Suite
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Local Redis + Upstash's REST look-alike (serverless-redis-http), fresh and empty for every run, so test rate-limit
    # counters never touch a real Upstash database (Upstash terms: one free account per person, used by production).
    # The app reaches them through scripts/ci/upstash-local-proxy.ts (port 8080), which removes the Upstash-only
    # `allow-key-locking` script flag that normal Redis rejects.
    services:
      redis:
        image: redis:7-alpine
      serverless-redis-http:
        image: hiett/serverless-redis-http:0.0.10
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: e2e-local-srh-token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # ---- Test runner (Playwright) ----
      E2E_TARGET: staging
      E2E_BASE_URL: http://localhost:3000
      E2E_CONFIRM_STAGING: ${{ secrets.E2E_CONFIRM_STAGING }}
      E2E_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL_UNPOOLED: ${{ secrets.E2E_STAGING_DATABASE_URL_UNPOOLED }}
      E2E_DB_HOST_ALLOWLIST: ${{ vars.E2E_DB_HOST_ALLOWLIST }}
      E2E_FORBIDDEN_DB_HOSTS: ${{ vars.E2E_FORBIDDEN_DB_HOSTS }}
      E2E_FORBIDDEN_HOSTS: ${{ vars.E2E_FORBIDDEN_HOSTS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_EXPECT_VERIFICATION_REQUIRED: ${{ vars.E2E_EXPECT_VERIFICATION_REQUIRED || 'true' }}
      E2E_VERIFY_MODE: db
      E2E_EXPECT_ARCHIVAL: 'false'
      # Redis starts empty every run, but one run signs up up to 4 users from this IP (limit 3/hour), so the specs
      # still reset the auth counters between scenarios, on the local look-alike only (allow-listed host).
      E2E_UPSTASH_REST_URL: http://localhost:8080
      E2E_UPSTASH_REST_TOKEN: e2e-local-srh-token
      E2E_UPSTASH_HOST_ALLOWLIST: localhost
      E2E_UPSTASH_ALLOW_FLUSH: 'true'
      # ---- The app under test (build + `next start` on this runner) ----
      # SKIP_ENV_VALIDATION: production validation rejects an http://localhost app address, which is exactly what
      # this runner serves. Allowed here only because RENDER is not set (lib/env.ts never skips on Render).
      SKIP_ENV_VALIDATION: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPPORT_EMAIL: support@e2e.example.invalid
      FEEDBACK_RECIPIENT_EMAIL: feedback@e2e.example.invalid
      DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      # The local look-alike above. A plain http://localhost address is accepted only because validation is skipped
      # on this runner (lib/env.ts); it can never be used on Render. The token is a fixed local value, not a secret.
      UPSTASH_REDIS_REST_URL: http://localhost:8080
      UPSTASH_REDIS_REST_TOKEN: e2e-local-srh-token
      PLATFORM_ADMIN_EMAILS: ${{ secrets.E2E_ADMIN_EMAIL }}
      # Obviously fake: no real PDF, e-mail or file upload can happen from E2E.
      BREVO_API_KEY: e2e-placeholder-brevo-key
      EMAIL_FROM: billing@e2e.example.invalid
      # Deliberately not a valid account ID: the PDF setting fails validation, so no request ever reaches Cloudflare.
      CLOUDFLARE_ACCOUNT_ID: e2e-placeholder-not-a-real-account
      CLOUDFLARE_API_TOKEN: e2e-placeholder-token
      IDRIVE_E2_ENDPOINT: https://s3.e2e.example.invalid
      IDRIVE_E2_REGION: e2e-region
      IDRIVE_E2_BUCKET_NAME: e2e-bucket
      IDRIVE_E2_ACCESS_KEY: e2e-access-key
      IDRIVE_E2_SECRET_KEY: e2e-secret-key
      ADMIN_UPI_ID: e2e@upi
      ADMIN_UPI_NAME: E2E Placeholder
      ADMIN_BANK_NAME: E2E Placeholder Bank
      ADMIN_BANK_ACC_NAME: E2E Placeholder
      ADMIN_BANK_ACC_NO: '000000000000'
      ADMIN_BANK_IFSC: TEST0E2E001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate per-run secrets
        # Fresh random values every run: never the production ones, never stored anywhere.
        run: |
          set -euo pipefail
          cookie=$(openssl rand -hex 32); cron=$(openssl rand -hex 32)
          echo "::add-mask::$cookie"; echo "::add-mask::$cron"
          { echo "NEON_AUTH_COOKIE_SECRET=$cookie"; echo "CRON_SECRET=$cron"; } >> "$GITHUB_ENV"

      - name: Start the Upstash flag proxy (CI only)
        run: |
          nohup pnpm e2e:redis-proxy > "$RUNNER_TEMP/redis-proxy.log" 2>&1 &

      - name: Check the local Redis look-alike answers (through the proxy)
        run: |
          set -uo pipefail
          reply=""
          for i in $(seq 1 30); do
            # Same request shape as @upstash/redis: JSON body with a JSON content type.
            reply=$(curl --silent --show-error --max-time 3 -H "Authorization: Bearer e2e-local-srh-token" \
                    -H "Content-Type: application/json" -d '["PING"]' http://localhost:8080/ 2>&1) || true
            if printf '%s' "$reply" | grep -q PONG; then
              echo "Redis look-alike is up: $reply"; exit 0
            fi
            sleep 2
          done
          echo "::error::serverless-redis-http did not answer PING. Last reply: ${reply:-<empty>}"
          docker ps -a || true
          cat "$RUNNER_TEMP/redis-proxy.log" || true
          exit 1

      - name: Run staging migrations
        run: pnpm e2e:migrate-staging

      - name: Build the app
        run: pnpm build

      - name: Start the app (next start) and wait for it
        run: |
          set -euo pipefail
          nohup pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail --max-time 5 http://localhost:3000/ping > /dev/null; then
              echo "App is up after ${i}x2 s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The app did not answer /ping within 120 s."
          tail -n 50 "$RUNNER_TEMP/app.log" || true
          exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: pnpm e2e

      - name: Show the app log tail on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/app.log" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E Test Results"
            echo "- **Target**: the pull request built and started on the runner (\`http://localhost:3000\`)"
            echo "- **Verification Mode**: \`${E2E_VERIFY_MODE}\`"
            echo "- **Report**: download the \`playwright-report\` artifact for traces and videos."
          } >> "$GITHUB_STEP_SUMMARY"
