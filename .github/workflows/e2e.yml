name: E2E (Staging Preview)

# Runs the Playwright suite against the Vercel Preview deployment of the pull request's head commit.
# Preview deployments use the isolated Neon branch `staging-e2e` (database neondb). Setup: docs/e2e-staging-setup.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Vercel Preview URL to test (leave blank to auto-detect for the selected ref)'
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  statuses: read
  # Read the Vercel bot's PR comment (preview address) via the issue-comments API.
  pull-requests: read
  issues: read

concurrency:
  # One run at a time: all runs share the single staging database and its trusted-origin list.
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Fork PRs never receive secrets, so never run there.
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.pull_request.head.repo.full_name
    env:
      CI: 'true'
      E2E_TARGET: staging
      E2E_CONFIRM_STAGING: ${{ secrets.E2E_CONFIRM_STAGING }}
      # The app and the tests share one database: the staging branch (pooled for tests, unpooled for migrations).
      E2E_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL: ${{ secrets.E2E_STAGING_DATABASE_URL }}
      E2E_STAGING_DATABASE_URL_UNPOOLED: ${{ secrets.E2E_STAGING_DATABASE_URL_UNPOOLED }}
      E2E_DB_HOST_ALLOWLIST: ${{ vars.E2E_DB_HOST_ALLOWLIST }}
      E2E_FORBIDDEN_DB_HOSTS: ${{ vars.E2E_FORBIDDEN_DB_HOSTS }}
      E2E_FORBIDDEN_HOSTS: ${{ vars.E2E_FORBIDDEN_HOSTS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_EXPECT_VERIFICATION_REQUIRED: ${{ vars.E2E_EXPECT_VERIFICATION_REQUIRED || 'true' }}
      E2E_VERIFY_MODE: ${{ vars.E2E_VERIFY_MODE || 'direct_db' }}
      E2E_VERCEL_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_BYPASS_SECRET }}
      E2E_UPSTASH_REST_URL: ${{ secrets.E2E_UPSTASH_REST_URL }}
      E2E_UPSTASH_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REST_TOKEN }}
      E2E_UPSTASH_HOST_ALLOWLIST: ${{ vars.E2E_UPSTASH_HOST_ALLOWLIST }}
      E2E_UPSTASH_ALLOW_FLUSH: 'true'
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_STAGING_BRANCH_ID: ${{ vars.NEON_STAGING_BRANCH_ID }}
    steps:
      - name: Check staging configuration
        id: config
        run: |
          MISSING=""
          for NAME in E2E_CONFIRM_STAGING E2E_DATABASE_URL E2E_STAGING_DATABASE_URL_UNPOOLED E2E_DB_HOST_ALLOWLIST \
                      E2E_FORBIDDEN_DB_HOSTS E2E_FORBIDDEN_HOSTS E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD \
                      E2E_VERCEL_BYPASS_SECRET NEON_API_KEY NEON_PROJECT_ID NEON_STAGING_BRANCH_ID; do
            if [ -z "${!NAME:-}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::notice::E2E staging is not configured (missing:$MISSING). Skipping. See docs/e2e-staging-setup.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: steps.config.outputs.configured == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        if: steps.config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve target preview URL
        id: resolve-url
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Vercel deploys the PR head commit, not the synthetic merge commit GitHub checks out.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_PREVIEW_URL: ${{ github.event.inputs.preview_url }}
        run: |
          if [ -n "${MANUAL_PREVIEW_URL:-}" ]; then
            echo "preview_url=${MANUAL_PREVIEW_URL}" >> "$GITHUB_OUTPUT"
            echo "Using manual preview URL: ${MANUAL_PREVIEW_URL}"
          else
            chmod +x ./scripts/ci/wait-for-preview.sh
            ./scripts/ci/wait-for-preview.sh
          fi

      - name: Run staging migrations
        if: steps.config.outputs.configured == 'true'
        env:
          E2E_BASE_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: pnpm e2e:migrate-staging

      - name: Trust the preview origin on the staging auth branch
        id: trust
        if: steps.config.outputs.configured == 'true'
        env:
          PREVIEW_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: pnpm exec tsx scripts/ci/neon-auth-trusted-origin.ts add "$PREVIEW_URL"

      - name: Install Playwright browsers
        if: steps.config.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        if: steps.config.outputs.configured == 'true'
        env:
          E2E_BASE_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: pnpm e2e

      - name: Remove the preview origin from the staging auth branch
        if: always() && steps.trust.outputs.added == 'true'
        env:
          PREVIEW_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: pnpm exec tsx scripts/ci/neon-auth-trusted-origin.ts remove "$PREVIEW_URL"

      - name: Upload Playwright report
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Write job summary
        if: always() && steps.config.outputs.configured == 'true'
        env:
          PREVIEW_URL: ${{ steps.resolve-url.outputs.preview_url }}
        run: |
          {
            echo "## Playwright E2E Test Results"
            echo "- **Target URL**: \`${PREVIEW_URL}\`"
            echo "- **Verification Mode**: \`${E2E_VERIFY_MODE}\`"
            echo "- **Report**: download the \`playwright-report\` artifact for traces and videos."
          } >> "$GITHUB_STEP_SUMMARY"
