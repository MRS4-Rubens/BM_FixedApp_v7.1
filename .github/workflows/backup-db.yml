name: Nightly database backup

# LAUNCH-L5 (docs/LAUNCH_CHECKLIST.md 2.7): encrypted pg_dump of the PRODUCTION database to the private
# IDrive e2 bucket `bizfolio-backups`. Keeps the newest 7 daily + 4 weekly (Sunday) copies.
#
# Off until launch: runs only when the repository VARIABLE `BACKUPS_ENABLED` is `true`. Once enabled, a missing
# secret FAILS the run (a silent skip would hide that backups stopped).
#
# Secrets: DATABASE_URL_UNPOOLED (prod direct URL), BACKUP_ENCRYPTION_PASSPHRASE (also kept in the password
#          manager: without it no backup can be opened), BACKUP_S3_ENDPOINT (e.g. https://s3.<region>.idrivee2.com),
#          BACKUP_S3_REGION, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY.
# Variable: BACKUP_S3_BUCKET (default bizfolio-backups).
#
# Restore (drill every 3 months, into a Neon branch of the TEST project, never over production):
#   aws s3 cp --endpoint-url "$ENDPOINT" s3://bizfolio-backups/daily/<file>.dump.gpg .
#   gpg --pinentry-mode loopback --decrypt --output db.dump <file>.dump.gpg   # asks for the passphrase (no --batch)
#   pg_restore --exit-on-error --no-owner --no-acl --dbname "<EMPTY restore_check database direct URL>" db.dump
#   echo $?   # must be 0; then run the SQL checks in docs/DEPLOYMENT.md "Restore" step 4
on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    name: Back up production database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never in forks; nothing until the owner turns backups on.
    if: github.event.repository.fork == false && vars.BACKUPS_ENABLED == 'true'
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || 'bizfolio-backups' }}
      # Postgres 18 client tools (must be >= the Neon server version).
      PG_IMAGE: postgres:18
    steps:
      - name: Check configuration
        run: |
          set -euo pipefail
          missing=""
          for name in DATABASE_URL_UNPOOLED BACKUP_ENCRYPTION_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION S3_ENDPOINT; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Backups are enabled but these secrets are missing:$missing"
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters."
            exit 1
          fi
          case "$S3_ENDPOINT" in https://*) ;; *) echo "::error::BACKUP_S3_ENDPOINT must start with https://"; exit 1 ;; esac

      - name: Dump the database (custom format, compressed)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup"
          docker run --rm -e PGURL="$DATABASE_URL_UNPOOLED" -v "$RUNNER_TEMP/backup:/out" "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-acl --file=/out/db.dump "$PGURL"'
          # Sanity check: the archive must be readable and contain the invoices table.
          docker run --rm -v "$RUNNER_TEMP/backup:/out" "$PG_IMAGE" pg_restore --list /out/db.dump > "$RUNNER_TEMP/backup/list.txt"
          if ! grep -q 'TABLE public invoices' "$RUNNER_TEMP/backup/list.txt"; then
            echo "::error::The dump does not contain the invoices table. Refusing to upload."
            exit 1
          fi
          echo "Dump size: $(du -h "$RUNNER_TEMP/backup/db.dump" | cut -f1)"

      - name: Encrypt (AES-256)
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$RUNNER_TEMP/backup/db.dump.gpg" "$RUNNER_TEMP/backup/db.dump"
          # Never upload or keep the unencrypted copy.
          shred -u "$RUNNER_TEMP/backup/db.dump"

      - name: Upload
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          aws s3 cp --only-show-errors --endpoint-url "$S3_ENDPOINT" \
            "$RUNNER_TEMP/backup/db.dump.gpg" "s3://$S3_BUCKET/daily/bizfolio-$stamp.dump.gpg"
          # Sundays (UTC) also keep a weekly copy.
          if [ "$(date -u +%u)" = "7" ]; then
            aws s3 cp --only-show-errors --endpoint-url "$S3_ENDPOINT" \
              "$RUNNER_TEMP/backup/db.dump.gpg" "s3://$S3_BUCKET/weekly/bizfolio-$stamp.dump.gpg"
          fi
          echo "Uploaded bizfolio-$stamp.dump.gpg"

      - name: Prune to 7 daily + 4 weekly
        run: |
          set -euo pipefail
          prune() {
            prefix="$1"; keep="$2"
            # Names sort by time (bizfolio-YYYY-MM-DDTHHMMZ), so the oldest come first.
            aws s3 ls --endpoint-url "$S3_ENDPOINT" "s3://$S3_BUCKET/$prefix/" \
              | awk '{print $4}' | grep -E '^bizfolio-[0-9T:Z-]+\.dump\.gpg$' | sort > "$RUNNER_TEMP/$prefix.txt" || true
            total=$(wc -l < "$RUNNER_TEMP/$prefix.txt")
            if [ "$total" -gt "$keep" ]; then
              head -n "$((total - keep))" "$RUNNER_TEMP/$prefix.txt" | while read -r name; do
                aws s3 rm --only-show-errors --endpoint-url "$S3_ENDPOINT" "s3://$S3_BUCKET/$prefix/$name"
                echo "Removed $prefix/$name"
              done
            fi
            echo "$prefix: kept $(( total < keep ? total : keep )) of $total"
          }
          prune daily 7
          prune weekly 4

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"
