allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
# SEC-007: same-major security floors for transitive deps. Never cross a major here. See docs/security/dependencies.md.
overrides:
  'brace-expansion@^1': ^1.1.21
  'brace-expansion@^2': ^2.1.7
  'brace-expansion@^5': ^5.0.12
  browserslist: ^4.29.5
  baseline-browser-mapping: ^2.11.35
  'fast-uri@^3': ^3.1.9
  'js-yaml@^4': ^4.3.2
  'nanoid@^3': ^3.3.20
  'postcss@^8': ^8.5.32
  source-map-js: ^1.2.2
  'zod@^4': ^4.6.7
  hono: ^4.13.17
  # Dependabot (2026-11-19): fixed majors for transitive helpers. uuid is used by exceljs (v4 only); the rest are dev/build tools.
  'uuid@<11.1.1': ^11.1.1
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'esbuild@<0.25.0': ^0.25.0
patchedDependencies:
  '@neondatabase/auth': patches/@neondatabase__auth.patch
